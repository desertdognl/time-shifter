<!DOCTYPE html>
<html>
<head>
  <title>Time Shifter Settings</title>
  <style>
    body { background-color: #000; color: white; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding: 40px 20px; margin: 0; }
    .container { width: 100%; max-width: 600px; border: 1px solid #54E4C3; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(84, 228, 195, 0.2); }
    
    /* Logo and Header Layout */
    .header-container { display: flex; align-items: center; gap: 15px; margin-bottom: 10px; }
    .logo { width: 48px; height: 48px; border-radius: 8px; border: 1px solid #333; }
    h1 { color: #54E4C3; font-weight: 600; margin: 0; }
    
    .main-desc { color: #bbb; line-height: 1.6; margin-bottom: 30px; border-bottom: 1px solid #222; padding-bottom: 20px; margin-top: 15px; }
    .setting-group { margin-bottom: 30px; }
    .setting-header { color: #54E4C3; font-weight: bold; font-size: 1.4em; display: block; margin-bottom: 5px; }
    .setting-info { color: #888; font-size: 1.1em; display: block; margin-bottom: 12px; line-height: 1.4; }
    
    .clock-display { background: #111; padding: 20px; border-radius: 8px; text-align: center; margin-bottom: 30px; border: 1px solid #222; }
    .clock-time { font-size: 3em; font-family: 'Consolas', monospace; color: #54E4C3; margin: 10px 0; }
    
    .grid-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; background: #111; padding: 20px; border-radius: 8px; }
    .input-unit { text-align: center; }
    .input-unit label { display: block; color: #888; margin-bottom: 8px; font-size: 0.9em; text-transform: uppercase; }
    
    input[type="number"] { width: 100%; background: #000; color: white; border: 1px solid #333; border-radius: 6px; padding: 10px; box-sizing: border-box; text-align: center; font-size: 1.2em; font-family: 'Consolas', monospace; }
    input:focus { outline: none; border-color: #54E4C3; }
    
    .button-stack { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
    button { padding: 15px; cursor: pointer; font-weight: bold; border-radius: 8px; width: 100%; transition: all 0.3s ease; text-transform: uppercase; letter-spacing: 1px; }
    .btn-save { background-color: #54E4C3; color: #000; border: none; }
    .btn-save:hover { background-color: #43b89e; transform: scale(1.01); }
    .btn-reset { background-color: transparent; color: #ef4444; border: 1px solid #ef4444; }
    .btn-reset:hover { background-color: rgba(239, 68, 68, 0.1); transform: scale(1.01); }
    
    .status { color: #54E4C3; font-size: 1.1em; margin-top: 15px; text-align: center; height: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-container">
      <img src="icon48.png" alt="Logo" class="logo">
      <h1>Time Shifter</h1>
    </div>
    
    <p class="main-desc">Adjust the global browser clock relative to your system time. This offset will be applied to all pages.</p>

    <div class="clock-display">
      <span class="setting-info">Current Perceived Browser Time</span>
      <div id="displayTime" class="clock-time">00:00:00</div>
    </div>

    <div class="setting-group">
      <span class="setting-header">Set Time Offset</span>
      <span class="setting-info">Enter the amount of time to add or subtract from real world time.</span>
      <div class="grid-row">
        <div class="input-unit"><label>Hours</label><input type="number" id="h" value="0"></div>
        <div class="input-unit"><label>Minutes</label><input type="number" id="m" value="0"></div>
        <div class="input-unit"><label>Seconds</label><input type="number" id="s" value="0"></div>
      </div>
    </div>

    <div class="button-stack">
      <button id="saveBtn" class="btn-save">Save & Apply Offset</button>
      <button id="resetBtn" class="btn-reset">Reset to System Time</button>
    </div>
    
    <div id="status" class="status"></div>
    <center>
      <a href="https://www.buymeacoffee.com/desertdog" target="_blank"><img src="https://cdn.buymeacoffee.com/buttons/v2/default-yellow.png" alt="Buy Me A Coffee" style="height: 60px !important;width: 217px !important;" ></a>
    </center>
</a>
  </div>
  <script src="options.js"></script>
</body>
</html>
